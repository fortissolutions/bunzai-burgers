# Bunzai Burgers in production, behind nginx on the host.
#
#   docker compose up -d          start (or update) the app
#   docker compose logs -f app    follow the app logs
#   docker compose down           stop (the database volume is kept)
#
# The app listens only on 127.0.0.1:${APP_PORT:-8080}, so it is reachable only
# through nginx (see deploy/nginx/bunzai.conf), never directly from the internet.
services:
  app:
    image: ${APP_IMAGE:-bunzai-burgers:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /app/data
      TRUST_PROXY: "1"          # trust nginx's X-Forwarded-For / X-Forwarded-Proto
    volumes:
      - bunzai-data:/app/data   # SQLite database + backups
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  bunzai-data:
