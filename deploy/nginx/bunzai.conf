# nginx site for Bunzai Burgers (app container on 127.0.0.1:8080).
#
# Install:
#   Amazon Linux: sudo cp bunzai.conf /etc/nginx/conf.d/bunzai.conf
#   Ubuntu:       sudo cp bunzai.conf /etc/nginx/sites-available/bunzai.conf
#                 sudo ln -s /etc/nginx/sites-available/bunzai.conf /etc/nginx/sites-enabled/
# Replace spin.yourdomain.com below, then:
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS (adds the 443 server block and the http -> https redirect for you):
#   sudo certbot --nginx -d spin.yourdomain.com

upstream bunzai_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name spin.yourdomain.com;

    # Reward claims and admin requests are tiny; reject anything large.
    client_max_body_size 64k;

    # Compress pages, scripts and the phone-validation library.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://bunzai_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The app uses these for the real client IP (rate limiting) and HTTPS detection.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}
